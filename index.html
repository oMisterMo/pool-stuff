<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>8 Ball Pool</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <canvas id="canvas" width="800" height="600"></canvas>
    
        <!-- <div id="controls">
            <button id="play">Play</button>
            <button id="reset">Reset</button>
        </div> -->

        <div id="ball-controls">
            <button class="ball-picker selected" data-color="white" aria-label="White ball" title="White ball"></button>
            <button class="ball-picker" data-color="red" aria-label="Red ball" title="Red ball"></button>
            <button class="ball-picker" data-color="yellow" aria-label="Yellow ball" title="Yellow ball"></button>
            <button class="ball-picker" data-color="black" aria-label="Black ball" title="Black ball"></button>
        </div>

        <div id="snap-controls">
            <label><input type="checkbox" id="snap" checked> Snap</label>
        </div>

        <div id="clear-controls">
            <button class="clear-balls" data-color="white">Clear White</button>
            <button class="clear-balls" data-color="red">Clear Red</button>
            <button class="clear-balls" data-color="yellow">Clear Yellow</button>
            <button class="clear-balls" data-color="black">Clear Black</button>
            <button class="clear-balls">Clear All</button>
        </div>

        <div id="theme-controls">
            <button id="theme">Theme: Classic Green</button>
        </div>

        <div id="export-controls">
            <button id="export">Export PNG</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
